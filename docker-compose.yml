services:
  # ==========================================
  # METADATA & DATA WAREHOUSE LAYER
  # ==========================================
  postgres:
    image: postgres:17
    container_name: cryptoforge-postgres
    environment:
      POSTGRES_USER: forge_admin
      POSTGRES_PASSWORD: forge_secure_password
      POSTGRES_DB: cryptoforge_dw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge_admin -d cryptoforge_dw"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forge-network

  # ==========================================
  # OFFICIAL APACHE SPARK 4.0 CLUSTER
  # ==========================================
  spark-master:
    image: apache/spark:4.0.3
    container_name: cryptoforge-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"   # Master Web UI
      - "7077:7077"   # Cluster Communication
    volumes:
      - ./data:/opt/spark/data
      - ./spark/jobs:/opt/spark/jobs
    networks:
      - forge-network

  spark-worker-1:
    image: apache/spark:4.0.3
    container_name: cryptoforge-spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    volumes:
      - ./data:/opt/spark/data
      - ./spark/jobs:/opt/spark/jobs
    networks:
      - forge-network

  spark-worker-2:
    image: apache/spark:4.0.3
    container_name: cryptoforge-spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    volumes:
      - ./data:/opt/spark/data
      - ./spark/jobs:/opt/spark/jobs
    networks:
      - forge-network

# ==========================================
# STORAGE VOLUMES & INFRASTRUCTURE NETWORKS
# ==========================================
volumes:
  postgres_data:
    driver: local

networks:
  forge-network:
    driver: bridge