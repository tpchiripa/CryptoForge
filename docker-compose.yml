services:
  # ==========================================
  # METADATA & DATA WAREHOUSE LAYER
  # ==========================================
  postgres:
    image: postgres:17
    container_name: cryptoforge-postgres
    environment:
      POSTGRES_USER: forge_admin
      POSTGRES_PASSWORD: forge_secure_password
      POSTGRES_DB: cryptoforge_dw
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge_admin -d cryptoforge_dw"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forge-network
  # ==========================================
  # ORCHESTRATION LAYER
  # ==========================================
  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    container_name: cryptoforge-airflow
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://forge_admin:forge_secure_password@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    ports:
      - "8090:8080"   # Airflow Web UI (8080 already used by redpanda-console on this host)
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/opt/cryptoforge/data
      - ./configs:/opt/cryptoforge/configs
      - ./reports:/opt/cryptoforge/reports
    networks:
      - forge-network
  # ==========================================
  # OFFICIAL APACHE SPARK 4.0 CLUSTER
  # ==========================================
  spark-master:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    container_name: cryptoforge-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8091:8080"   # Master Web UI (8080 taken by redpanda-console, 8090 taken by Airflow)
      - "7077:7077"   # Cluster Communication
    volumes:
      - ./data:/opt/spark/data
      - ./spark/jobs:/opt/spark/jobs
    networks:
      - forge-network
  spark-worker-1:
    image: apache/spark:4.0.3
    container_name: cryptoforge-spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    volumes:
      - ./data:/opt/spark/data
      - ./spark/jobs:/opt/spark/jobs
    networks:
      - forge-network
  spark-worker-2:
    image: apache/spark:4.0.3
    container_name: cryptoforge-spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    volumes:
      - ./data:/opt/spark/data
      - ./spark/jobs:/opt/spark/jobs
    networks:
      - forge-network
# ==========================================
# STORAGE VOLUMES & INFRASTRUCTURE NETWORKS
# ==========================================
volumes:
  postgres_data:
    driver: local
networks:
  forge-network:
    driver: bridge